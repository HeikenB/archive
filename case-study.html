<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Case Study | HB Portfolio</title>
  <meta name="description" content="Case study viewer">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Styles -->
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/case-study.css">

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
</head>
<body class="case-study-page">
  <!-- Navigation -->
  <header class="nav-header">
    <nav class="nav-container">
      <a href="index.html" class="nav-logo">
        <img src="assets/logos/hb-logo.png" alt="HB Logo" width="40" height="40">
      </a>
      <ul class="nav-links">
        <li><a href="index.html#credentials">Credentials</a></li>
        <li><a href="index.html#contact">Contact</a></li>
      </ul>
    </nav>
  </header>

  <!-- Main Content -->
  <main class="case-study-layout">
    <!-- Sidebar -->
    <aside class="case-study-sidebar">
      <a href="index.html" class="back-link">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5M12 19l-7-7 7-7"/>
        </svg>
        Back
      </a>

      <h1 class="case-study-title" id="caseStudyTitle">
        <!-- Title will be populated by JavaScript -->
      </h1>

      <nav class="scrollspy" id="scrollspy">
        <!-- Scrollspy items will be populated by JavaScript -->
      </nav>
    </aside>

    <!-- PDF Viewer -->
    <div class="pdf-viewer" id="pdfViewer">
      <div class="pdf-loading-screen" id="pdfLoadingScreen">
        <div class="pdf-loading-content">
          <div class="pdf-loading-robot">
            <svg viewBox="0 0 40 50" fill="none" xmlns="http://www.w3.org/2000/svg">
              <line x1="20" y1="2" x2="20" y2="9" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="20" cy="2" r="2.5" fill="currentColor" class="robot-antenna-dot"/>
              <rect x="4" y="9" width="32" height="24" rx="4" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="14" cy="21" r="3.5" fill="currentColor" class="robot-eye"/>
              <circle cx="26" cy="21" r="3.5" fill="currentColor" class="robot-eye"/>
              <circle cx="15.5" cy="19.5" r="1.2" fill="white"/>
              <circle cx="27.5" cy="19.5" r="1.2" fill="white"/>
              <path d="M14 29 Q20 33 26 29" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
              <rect x="9" y="36" width="22" height="13" rx="3" stroke="currentColor" stroke-width="1.5"/>
              <circle cx="17" cy="42" r="2" fill="currentColor"/>
              <circle cx="23" cy="42" r="2" fill="currentColor"/>
            </svg>
          </div>
          <p class="pdf-loading-message-line">
            <span class="pdf-loading-message" id="pdfLoadingMessage">Fetching from the archive</span><span class="pdf-loading-cursor">_</span>
          </p>
        </div>
      </div>
      <div class="pdf-pages" id="pdfPages">
        <!-- PDF pages will be populated by JavaScript -->
      </div>
    </div>
  </main>

  <!-- Mobile Sidebar Toggle -->
  <button class="sidebar-toggle" id="sidebarToggle" aria-label="Toggle sidebar">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <path d="M3 12h18M3 6h18M3 18h18"/>
    </svg>
  </button>

  <!-- Scripts -->
  <script src="js/case-study.js"></script>
</body>
</html>
